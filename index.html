async function genTitle(conv, q, a) {
  const tmp = { content: "" };
  try {
    await streamAI([
      { role: "system", content: "Tu donnes des titres de conversation. Réponds uniquement par un titre de 2 à 6 mots en français, sans guillemets ni point final." },
      { role: "user", content: `Message : ${q.slice(0, 400)}\nRéponse : ${a.slice(0, 500)}` }], tmp);
  } catch (e) { return; }
  const t = tmp.content.split("\n")[0].replace(/[«»"*#\[\]]/g, "").replace(/^titre\s*:\s*/i, "").trim();
  if (t.length < 3 || t.length > 60 || !conv.auto) return;
  conv.title = t;
  saveAI();
  if (S.tab === "ai" && !S.ai.busy) renderAI();
}

// ---------- ce que l'IA sait de toi ----------
function aiContext() {
  const items = S.store ? S.store.items : [];
  const r = (i) => i.rating || 0;
  const desc = (i) => {
    const p = [];
    if (i.rating) p.push(`${i.rating}/10`);
    if (i.fav) p.push("favori");
    if (i.kind === "anime" && i.status === "doing" && (i.progress || i.total)) p.push(`ép. ${i.progress || 0}/${i.total || "?"}`);
    if (i.kind === "game" && i.hours) p.push(`${fmtNum(i.hours, 1)} h`);
    if (S.prefs.aiNotes && i.description && (i.fav || r(i) >= 8 || (r(i) && r(i) <= 4))) p.push(`avis : « ${i.description.slice(0, 90).replace(/\s+/g, " ")} »`);
    return i.name + (p.length ? ` (${p.join(", ")})` : "");
  };
  const out = [];
  let budget = 11000;
  const section = (title, list, full = true) => {
    if (!list.length) return;
    const parts = [];
    for (const i of list) {
      const x = full ? desc(i) : i.name;
      if (budget - x.length - 3 < 0) break;
      parts.push(x);
      budget -= x.length + 3;
    }
    if (parts.length < list.length) parts.push(`+${list.length - parts.length} autres`);
    out.push(`${title} [${list.length}] : ${parts.join(" ; ")}`);
  };
  for (const k of KINDS) {
    const L = items.filter((i) => i.kind === k);
    if (!L.length) continue;
    const G = k === "game";
    out.push(`\n## ${G ? "JEUX" : "ANIMES"} (${L.length})`);
    section("ADORÉS (favoris ou 8-10/10) : ses vrais goûts", L.filter((i) => i.fav || r(i) >= 8).sort((a, b) => r(b) + (b.fav ? 2 : 0) - r(a) - (a.fav ? 2 : 0)));
    section("AIMÉS (6-7/10)", L.filter((i) => !i.fav && r(i) >= 6 && r(i) < 8));
    section("PAS AIMÉS (1-5/10) : à éviter", L.filter((i) => !i.fav && r(i) && r(i) < 6).sort((a, b) => r(a) - r(b)));
    section("EN COURS", L.filter((i) => !i.fav && !r(i) && i.status === "doing"));
    section(G ? "FINIS SANS NOTE" : "VUS SANS NOTE", L.filter((i) => !i.fav && !r(i) && i.status === "done"), false);
    section(G ? "PRÉVUS « À JOUER »" : "PRÉVUS « À VOIR »", L.filter((i) => !i.fav && !r(i) && i.status === "todo"), false);
  }
  return `Collection de ${S.pseudo} (${items.length} titres) :` + out.join("\n");
}
function exclusionNote(text) {
  if (!RECO_RE.test(text) || OWN_RE.test(text) || !S.store) return "";
  const a = /anim|s[ée]rie|regarder|mater|[ée]pisode/i.test(text), g = /\bjeux?\b|jouer|game/i.test(text);
  const kinds = a && !g ? ["anime"] : g && !a ? ["game"] : KINDS;
  let left = 6000, s = "";
  for (const k of kinds) {
    const names = S.store.items.filter((i) => i.kind === k).map((i) => i.name);
    if (!names.length) continue;
    const take = [];
    for (const n of names) { if (left - n.length - 3 < 0) break; take.push(n); left -= n.length + 3; }
    s += `\n${k === "game" ? "JEUX" : "ANIMES"} QUE J'AI DÉJÀ (${names.length}) : ${take.join(" ; ")}${take.length < names.length ? " ; …" : ""}`;
  }
  return `\n\n---\n(Message automatique de l'app, n'en parle pas.) Ne recommande rien de cette liste, même sous un autre nom ou comme autre saison, film ou suite. Appuie-toi sur l'ensemble de mes titres ADORÉS.${s}`;
}
function aiSystem() {
  return `Tu es ${AI_NAME}, l'acolyte de ${S.pseudo} dans l'app ${AI_APP}. Nous sommes le ${fmtDate(new Date().toISOString())}.
Réponds en français. ${TONES[S.prefs.aiTone] || TONES.pote} ${(LENGTHS[S.prefs.aiLength] || LENGTHS.normal)[0]}

QUI TU ES
- Un vrai passionné de jeux vidéo et d'animes, avec tes propres goûts et avis. Tu peux être enthousiaste, nuancé, pas d'accord, faire une blague, raconter une anecdote, digresser un peu.
- Tu parles naturellement, comme dans une vraie discussion. Pas de formules d'assistant (« Bien sûr ! », « Excellente question », « N'hésite pas à… »), pas de résumé à la fin, pas de liste quand une phrase suffit.
- Tu n'es pas obligé de recommander un truc à chaque message : si on discute, tu discutes.
- Ton terrain, c'est les jeux, les animes, les mangas, les studios, les consoles. Si on parle d'autre chose, tu peux répondre brièvement, sans faire la police.

HONNÊTETÉ (ta règle la plus importante)
- N'affirme jamais une chose dont tu n'es pas sûr. Mieux vaut « je ne sais pas » qu'une info fausse dite avec assurance.
- Ça doit s'entendre dans ta façon de parler : ce que tu sais, tu le dis normalement ; ce dont tu doutes, tu le signales (« il me semble », « si je me souviens bien », « à vérifier ») ; ce que tu ignores, tu le dis franchement.
- C'est sur les détails que tu te trompes le plus : dates de sortie, nombre d'épisodes ou de saisons, studios, doubleurs, prix, plateformes, durée de vie, scènes précises. Si tu n'es pas sûr, reste général ou dis que tu as un doute.
- Tes connaissances s'arrêtent à une certaine date (vers 2023-2024). Pour tout ce qui est récent, à venir ou en cours de diffusion, préviens que tu n'as peut-être pas les dernières infos. N'invente jamais une annonce, une suite ou une date.
- Ne recommande que des œuvres dont tu es certain qu'elles existent.
- Si ${S.pseudo} te corrige : s'il a raison, reconnais-le simplement ; s'il se trompe, dis-le gentiment au lieu de lui donner raison pour lui faire plaisir.
- Les infos de sa collection (plus bas) sont fiables : base-toi dessus.

RECOMMANDATIONS
1. Analyse l'ENSEMBLE de ses titres ADORÉS et AIMÉS (genres, ambiance, thèmes, rythme, studios) et tiens compte de ce qu'il n'a pas aimé.
2. Ne recommande jamais un titre de sa collection, ni une autre saison, un film ou une suite d'une œuvre qu'il a déjà.
3. Justifie chaque conseil en citant 1 ou 2 titres de SA collection.
4. Un anime = l'œuvre entière, pas « saison 2 ».

FORMAT
- Un titre que tu RECOMMANDES s'écrit [[Titre officiel|jeu]] ou [[Titre officiel|anime]].
- Un titre de SA collection s'écrit en *italique*, jamais entre [[ ]].
- Pas de spoilers sans prévenir. Markdown simple : **gras**, listes avec -.

${aiContext()}`;
}
function aiErrorText(e) {
  if (e instanceof AiError) {
    if (e.status === 404) return "Ton relais Cloudflare ne connaît pas encore l'assistant.\nRemplace son code par le nouveau worker.js.";
    if (e.code === "no_binding") return "Il manque la liaison Workers AI sur ton relais Cloudflare (nom de variable : AI).";
    if (e.status === 429 || e.code === "quota") return "Le quota gratuit d'IA du jour est épuisé. Réessaie demain, ou choisis le modèle « Rapide » dans les réglages.";
    if (e.code === "bad_messages") return "Ta collection est trop grosse pour le relais : mets à jour les deux limites dans worker.js.";
    if (e.code === "empty") return `${AI_NAME} n'a rien répondu. Réessaie.`;
    return `Le relais a répondu avec une erreur (${e.status}${e.code ? " · " + e.code : ""}).`;
  }
  if (e instanceof TypeError) return `Impossible de joindre ${AI_NAME}. Vérifie ta connexion internet.`;
  return "Erreur : " + (e && e.message ? e.message : e);
}

function recoChip(title, kind) {
  const mine = ownedItem(kind, title);
  const unsure = !mine && kind !== "game" && A.found.get(nrm(title)) === false;
  kind = kind || (mine ? mine.kind : S.kind);
  return el("button", {
    class: "reco" + (mine ? " have" : "") + (unsure ? " unsure" : ""), type: "button",
    title: mine ? `Déjà dans ta collection (${mine.name})` : unsure ? "Pas trouvé tel quel sur AniList : vérifie avant de l'ajouter" : "Ajouter à ma collection",
    onclick: () => { const x = ownedItem(kind, title); if (x) openDetail(x.id); else addItem(kind, title); },
  }, icon(mine ? "check" : "plus", 13), title, ...(unsure ? [el("span", { text: " ?" })] : []));
}
function inlineNodes(text) {
  const out = [], re = /\[\[([^\[\]|]{1,120}?)(?:\|\s*([^\]]{1,12}))?\]\]|\*\*([^*]+)\*\*|\*([^*\s][^*]*)\*/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[1]) out.push(recoChip(m[1].trim(), kindOf(m[2])));
    else if (m[3]) out.push(el("strong", {}, inlineNodes(m[3])));
    else {
      const own = ownedItem(null, m[4]);
      out.push(own ? el("em", { class: "own", text: m[4], title: "Ouvrir la fiche", onclick: () => openDetail(own.id) }) : el("em", { text: m[4] }));
    }
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function mdNodes(text) {
  const out = [];
  let list = null;
  for (const raw of String(text).split("\n")) {
    const line = raw.trimEnd();

async function streamAI(messages, bot, signal) {
  const r = await fetch(proxyBase() + "/ai", {
    method: "POST", headers: { "Content-Type": "application/json" }, signal,
    body: JSON.stringify({ model: S.prefs.aiModel, max_tokens: (LENGTHS[S.prefs.aiLength] || LENGTHS.normal)[1], messages }),
  });
  if (!r.ok) {
    let code = "";
    try { code = (await r.json()).error || ""; } catch (e) { /* pas de json */ }
    throw new AiError(r.status, code);
  }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "";
  const eat = (line) => {
    line = line.trim();
    if (!line.startsWith("data:")) return;
    const data = line.slice(5).trim();
    if (!data || data === "[DONE]") return;
    try {
      const j = JSON.parse(data);
      const piece = typeof j.response === "string" ? j.response : ((((j.choices || [])[0] || {}).delta || {}).content || "");
      if (piece) { bot.content += piece; liveUpdate(bot); }
    } catch (e) { /* morceau incomplet */ }
  };
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) { eat(buf.slice(0, nl)); buf = buf.slice(nl + 1); }
  }
  if (buf) eat(buf);
}
async function verifyRecos(bot, convo, userText, signal, replace) {

    if (!recos.length) return;
    const animes = recos.filter((r) => r.kind !== "game").map((r) => r.title);
    if (animes.length) { setStatus(bot, "Vérifie ses infos…"); await animeAliases(animes, signal); setStatus(bot, ""); }
    if (!replace) return;

    if (!dup.length) return;
    const list = dup.map((d) => (nrm(d.it.name) === nrm(d.title) ? `« ${d.title} »` : `« ${d.title} » (c'est « ${d.it.name} » dans ma collection)`)).join(", ");

  body.append(el("div", { class: "seg", style: "margin-bottom:18px" }, KINDS.map((k) => el("button", { type: "button", class: cv.kind === k ? "on" : "", onclick: () => { cv.kind = k; renderCommunity(); } },
    icon(KIND_ICON[k], 16), KIND_SHORT[k], el("span", { class: "n", text: String(cv.data.filter((i) => i.kind === k).length) })))));
  const list = cv.data.filter((i) => i.kind === cv.kind);
  if (!list.length) { body.append(el("div", { class: "msgc", text: `Aucun ${KIND_WORDS[cv.kind][0]} dans cette collection.` })); return; }
  const grid = el("div", { class: "grid" + (S.prefs.layout === "list" ? " list" : "") },
    list.map((i) => cardEl(i, { fill: (b) => pubCoverInto(b, cv.uid, i.cover, i.name), avg: S.prefs.communityOnCards ? communityAvg(i.kind, i.name) : null })));
  grid.addEventListener("click", (e) => {
    const c = e.target.closest(".card");
    const it = c && list.find((x) => x.id === c.dataset.id);
    if (it) openPubItem(it, cv.uid);
  });
  body.append(grid);
}
function openPubItem(i, uid) {
  const art = el("div", { class: "art" });
  pubCoverInto(art, uid, i.cover, i.name);
  const mine = findMine(i.kind, i.name), avg = communityAvg(i.kind, i.name);
  const m = openModal({
    title: i.name, small: true, sheet: true,
    body: el("div", { class: "hrow", style: "align-items:flex-start;flex-wrap:nowrap" },
      el("div", { class: "cover", style: "width:110px;flex:none" }, art),
      el("div", { class: "vstack" },
        el("span", { class: "pill", style: "align-self:flex-start" }, icon(KIND_ICON[i.kind], 14), KIND_ONE[i.kind]),
        el("div", { class: "cstatus" }, el("span", { class: "dot", style: `background:${STATUS_COLORS[i.status]}` }), STATUS_LABELS[i.kind][i.status]),
        i.rating ? el("div", { class: "sub" }, "Sa note : ", el("span", { class: "score", text: scoreLabel(i.rating) })) : null,
        avg ? el("div", { class: "sub" }, "Moyenne Orbit : ", el("span", { class: "score", text: scoreLabel(avg.avg) }), ` (${avg.count})`) : null,
        progressText(i) ? el("div", { class: "sub", text: progressText(i) }) : null,
        mine ? el("div", { class: "tag", text: "✓ Dans ta collection" }) : null)),
    foot: [el("div", { class: "grow" }), mine
      ? el("button", { class: "btn primary", type: "button", onclick: async () => { m.close(); await settle(); openDetail(mine.id); } }, "Voir ma fiche")

  });
}

function exportJSON() {
  download(`gamevault-${new Date().toISOString().slice(0, 10)}.json`,
    JSON.stringify({ app: "Orbit", version: VERSION, exported: nowIso(), pseudo: S.pseudo, items: S.store.items }, null, 2), "application/json");
}
function exportCSV() {
  const esc = (v) => { v = String(v ?? ""); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const head = ["Nom", "Type", "Statut", "Note /10", "Favori", "Épisodes vus", "Épisodes total", "Heures", "Plateforme", "Ajouté le", "Terminé le", "Description"];
  const lines = [head.join(";"), ...S.store.items.map((i) => [i.name, KIND_ONE[i.kind], STATUS_LABELS[i.kind][i.status], i.rating || "", i.fav ? "oui" : "",
    i.progress || "", i.total || "", i.hours ? String(i.hours).replace(".", ",") : "", i.platform || "", (i.added || "").slice(0, 10), (i.finished || "").slice(0, 10), i.description || ""].map(esc).join(";"))];
  download(`gamevault-${new Date().toISOString().slice(0, 10)}.csv`, "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8");
}

  const pubSw = el("input", { type: "checkbox" });

  const syncRow = el("div", { class: "sd", id: "syncRow" });
  const st = S.store;

          el("div", { class: "hrow" }, el("button", { class: "btn small", type: "button", onclick: () => avFile.click() }, icon("image", 15), "Changer la photo"),
            S.profile.avatar ? el("button", { class: "btn small", type: "button", onclick: () => { saveProfile({ avatar: "" }); renderSettings(); } }, "Retirer") : null, avFile)),
        row("Bio", "Visible sur ton profil public (300 caractères max).", bio, true),
        row("Profil public", "Les autres joueurs peuvent voir ta collection dans l'onglet Communauté.", el("label", { class: "switch" }, pubSw, el("span")))),
      group("Thème", "palette",
        el("div", { class: "srow col" }, themes),
        row("Couleur principale", "Boutons, sélection, dégradés.", colorIn("accent")),
        row("Couleur de fond", "Un fond clair active automatiquement le mode clair.", colorIn("bg"))),

        row("Taille du texte", null, seg("textSize", [["s", "S"], ["m", "M"], ["l", "L"], ["xl", "XL"]])),
        row("Arrondi des coins", null, seg("radius", [["square", "Carré"], ["normal", "Normal"], ["round", "Rond"], ["pill", "Très rond"]])),
        row("Taille des cartes", null, seg("cardSize", [["s", "Petites"], ["m", "Moyennes"], ["l", "Grandes"]])),
        row("Effet verre", "Flou derrière les menus et barres.", sw("glass")),
        row("Halo coloré", "Lueur de couleur en fond d'écran.", sw("glow")),
        row("Animations", null, sw("anim")),
        row("Titres sous les jaquettes", "En vue grille.", sw("titles"))),
      group("Collection", "grid",
        row("Affichage", null, seg("layout", [["grid", "Grille"], ["list", "Liste"]])),
        row("Au démarrage", null, sel("startTab", [["last", "Dernier onglet utilisé"], ["game", "Jeux vidéo"], ["anime", "Animes"]])),
        row("Statut par défaut", "Pour les nouveaux ajouts.", sel("defaultStatus", [["todo", "À jouer / À voir"], ["doing", "En cours"], ["done", "Terminé"]])),
        row("Section « Reprendre »", "Tes titres en cours en haut de la collection.", sw("showContinue")),
        row("Badge de statut", "Sur les jaquettes.", sw("badgeStatus")),
        row("Badge de ma note", null, sw("badgeRating")),
        row("Barre de progression", "Épisodes vus sur les animes.", sw("badgeProgress")),
        row("Note Orbit sur les cartes", "La moyenne de tous les joueurs.", sw("communityOnCards")),
        row("Ouvrir la fiche après un ajout", null, sw("openAfterAdd")),
        row("Terminer automatiquement", "Un anime passe en « Terminé » au dernier épisode.", sw("autoDone")),
        row("Confirmer les suppressions", null, sw("confirmDelete"))),
      group("Recherche", "search",
        row("Steam", PROXY_URL.trim() ? "Jeux PC, images de grande qualité." : "Nécessite le relais Cloudflare (PROXY_URL).", sw("srcSteam")),
        row("Wikipédia", "Tous les jeux, même hors Steam : Fortnite, Minecraft, Zelda, Mario…", sw("srcWiki")),
        row("Langue des descriptions", "Pour Wikipédia.", seg("wikiLang", [["fr", "Français"], ["en", "Anglais"]])),
        row("Titre des animes", null, seg("animeTitle", [["english", "Anglais"], ["romaji", "Japonais (romaji)"]])),
        row("Description automatique", "Remplit la description lors d'un ajout.", sw("autoDesc"))),
      group("Notes", "star",
        row("Échelle", null, seg("scale", [["stars", "★ sur 5"], ["ten", "Sur 10"]])),
        row("Partager mes notes", "Elles comptent dans la moyenne Orbit (de façon anonyme).", sw("shareRatings")),
        row("Notes sur mon profil public", null, sw("publicRatings"))),
      group("Assistant IA", "sparkles",
        row("Activer Comète", "L'assistant qui te conseille selon ta collection.", sw("aiOn")),
        row("Modèle", "Malin : meilleures réponses. Rapide : plus léger, consomme moins de quota.", seg("aiModel", [["smart", "Malin"], ["fast", "Rapide"]])),
        row("Personnalité", null, sel("aiTone", [["pote", "Pote passionné"], ["expert", "Critique expert"], ["fun", "Ultra enthousiaste"], ["zen", "Calme et concis"]])),
        row("Longueur des réponses", null, seg("aiLength", [["court", "Courtes"], ["normal", "Normales"], ["detail", "Détaillées"]])),
        row("Partager mes notes perso", "L'IA lit aussi le début des descriptions de tes favoris et titres notés.", sw("aiNotes")),
        row("Conversation", `${S.ai.msgs.length} message${S.ai.msgs.length > 1 ? "s" : ""} enregistré${S.ai.msgs.length > 1 ? "s" : ""} sur cet appareil.`,
          el("button", { class: "btn small", type: "button", onclick: () => { clearAI(); renderSettings(); toast("Conversation effacée"); } }, icon("trash", 15), "Effacer"))),
      group("Données", "cloud",
        row("Synchronisation", null, el("button", { class: "btn small", type: "button", onclick: () => { coverMissing.clear(); schedulePush(0); toast("Synchronisation lancée", 1500); } }, icon("refresh", 15), "Synchroniser")),
        el("div", { class: "srow" }, syncRow),

          el("button", { class: "btn small", type: "button", onclick: exportJSON }, icon("download", 15), "JSON"),
          el("button", { class: "btn small", type: "button", onclick: exportCSV }, icon("download", 15), "CSV (Excel)"))),
        row("Vider le cache des images", "Elles seront retéléchargées depuis le cloud.", el("button", { class: "btn small", type: "button", onclick: async () => {

// ================================================================ connexion
let lgMode = "login";
function setLoginMode(mode) {
  lgMode = mode;
  const reg = mode === "register";
  $("lgTitle").textContent = reg ? "Créer un compte" : "Connexion";
  $("lgSub").textContent = reg ? "Choisis un pseudo (3 à 24 caractères : lettres, chiffres, _ ou -)\net un mot de passe d'au moins 6 caractères." : "Connecte-toi pour retrouver ta collection.";
  $("lgConfirmWrap").hidden = !reg;
  $("lgOk").textContent = reg ? "Créer mon compte" : "Se connecter";
  $("lgSwitch").textContent = reg ? "J'ai déjà un compte" : "Pas de compte ? Créer un compte";
  $("lgPass").setAttribute("autocomplete", reg ? "new-password" : "current-password");
  $("lgError").hidden = true;
}
function showLogin() { showScreen("login"); setLoginMode(lgMode); }
function authError(e) {
  const c = (e && e.code) || "";
  if (/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return "Pseudo ou mot de passe incorrect.";
  if (c.includes("email-already-in-use")) return "Ce pseudo est déjà pris.";
  if (c.includes("weak-password")) return "Mot de passe trop faible (6 caractères minimum).";
  if (c.includes("too-many-requests")) return "Trop d'essais. Attends quelques minutes.";
  if (c.includes("network-request-failed")) return "Pas de connexion internet.";
  return "Erreur : " + (c || (e && e.message) || e);
}
$("lgSwitch").addEventListener("click", () => setLoginMode(lgMode === "login" ? "register" : "login"));
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const showErr = (t) => { $("lgError").textContent = t; $("lgError").hidden = false; };
  const pseudo = $("lgPseudo").value.trim().toLowerCase(), pass = $("lgPass").value;
  if (!PSEUDO_RE.test(pseudo)) return showErr("Le pseudo doit faire 3 à 24 caractères : lettres, chiffres, _ ou -.");
  if (pass.length < 6) return showErr("Le mot de passe doit faire au moins 6 caractères.");
  if (lgMode === "register" && pass !== $("lgConfirm").value) return showErr("Les deux mots de passe ne sont pas identiques.");
  const btn = $("lgOk");
  btn.disabled = true;
  $("lgError").hidden = true;
  try {
    const email = `${pseudo}@${PSEUDO_DOMAIN}`;
    if (lgMode === "register") await createUserWithEmailAndPassword(auth, email, pass);
    else await signInWithEmailAndPassword(auth, email, pass);
    $("lgPass").value = "";
    $("lgConfirm").value = "";
  } catch (x) { showErr(authError(x)); }
  finally { btn.disabled = false; }
});

// ================================================================ demarrage
buildShell();
if (!configured) showScreen("setup");
else onAuthStateChanged(auth, (u) => {
  if (u) { if (S.uid !== u.uid) startSession(u); }
  else { endSession(); showLogin(); }
});
</script>
