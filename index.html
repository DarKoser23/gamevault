// ---------------------------------------------------------------- outils
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "value") e.value = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}
const $ = (id) => document.getElementById(id);
const spaces = (t) => String(t ?? "").split(/\s+/).filter(Boolean).join(" ");
const normalize = (t) => String(t).normalize("NFD").toLowerCase().replace(/\p{Mn}/gu, "");
function newId() {
  if (crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
  const b = crypto.getRandomValues(new Uint8Array(16));
  return [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
}
function nowIso() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function countText(kind, n) {

function cleanText(t, limit) {
  t = String(t || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "");
  const ta = document.createElement("textarea");
  ta.innerHTML = t;
  t = ta.value.replace(/[ \t]+/g, " ").replace(/\n\s*\n\s*\n+/g, "\n\n");
  return t.trim().slice(0, limit);
}
function uniq(urls) {
  const seen = new Set(), out = [];
  for (const u of urls) if (u && String(u).startsWith("https://") && !seen.has(u)) { seen.add(u); out.push(u); }
  return out;
}
function stable(v) {
  if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";

}
const toInt = (v) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : 0; };

let toastTimer = null;

  const t = $("toast");

  t.classList.add("show");

// ---------------------------------------------------------------- donnees (meme format que le PC)
function cleanItem(it) {
  if (!it || typeof it !== "object") return null;
  const name = spaces(it.name).slice(0, MAX_NAME);
  if (!name) return null;
  const kind = KINDS.includes(it.kind) ? it.kind : "game";
  let status = OLD_STATUS[it.status] || it.status;
  if (!STATUSES.includes(status)) status = "todo";
  const cover = it.cover ? String(it.cover).split(/[\\/]/).pop() : "";
  let id = String(it.id || "");
  if (!SAFE_ID.test(id)) id = newId();
  return {
    id, kind, name,
    description: String(it.description || "").slice(0, MAX_DESC),
    status, cover,
    added: String(it.added || nowIso()),
    modified: toInt(it.modified),
  };
}
function parseLibrary(raw) {
  raw = raw && typeof raw === "object" ? raw : {};
  let items = raw.items || [];
  if (!Array.isArray(items) && typeof items === "object") {
    const key = (k) => (/^\d+$/.test(k) ? +k : 0);
    items = Object.keys(items).sort((a, b) => key(a) - key(b)).map((k) => items[k]);
  }
  if (!Array.isArray(items)) items = [];
  const clean = [], seen = new Set();
  for (const it of items) {
    const c = cleanItem(it);
    if (c && !seen.has(c.id)) { seen.add(c.id); clean.push(c); }
  }
  const deleted = {};
  if (raw.deleted && typeof raw.deleted === "object") {
    for (const [k, v] of Object.entries(raw.deleted)) {
      const n = parseInt(v, 10);
      if (SAFE_ID.test(k) && Number.isFinite(n)) deleted[k] = n;
    }
  }
  return { items: clean, deleted, order_modified: toInt(raw.order_modified) };
}
function mergeLibraries(a, b) {
  const deleted = { ...a.deleted };
  for (const [k, v] of Object.entries(b.deleted)) if (v > (deleted[k] || 0)) deleted[k] = v;
  const best = new Map();
  for (const lib of [a, b]) for (const it of lib.items) {
    const cur = best.get(it.id);
    if (!cur || it.modified > cur.modified) best.set(it.id, it);
  }
  const alive = new Map();
  for (const [k, v] of best) {
    const del = Object.prototype.hasOwnProperty.call(deleted, k) ? deleted[k] : -1;
    if (v.modified > del) alive.set(k, v);
  }
  const [p, s] = a.order_modified >= b.order_modified ? [a, b] : [b, a];
  const first = p.items.filter((i) => alive.has(i.id)).map((i) => i.id);
  const placed = new Set(first), extra = [];
  for (const i of s.items) if (alive.has(i.id) && !placed.has(i.id)) { extra.push(i.id); placed.add(i.id); }
  return { items: [...extra, ...first].map((id) => alive.get(id)), deleted,
           order_modified: Math.max(a.order_modified, b.order_modified) };
}
const sameLibrary = (a, b) => stable([a.items, a.deleted, a.order_modified]) === stable([b.items, b.deleted, b.order_modified]);
const payload = (lib) => JSON.parse(JSON.stringify({ items: lib.items, deleted: lib.deleted, order_modified: lib.order_modified }));
const coverKey = (name) => name.replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 200);

// ---------------------------------------------------------------- reseau
class HttpError extends Error { constructor(s) { super("HTTP " + s); this.status = s; } }
class TimeoutErr extends Error { constructor() { super("timeout"); } }
class NeedProxy extends Error { constructor() { super("proxy"); } }

async function fetchTimeout(url, ms = 12000, opts = {}) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { ...opts, signal: c.signal }); }
  catch (e) { if (e.name === "AbortError") throw new TimeoutErr(); throw e; }
  finally { clearTimeout(t); }
}
async function getJSON(url, opts) {
  const r = await fetchTimeout(url, 12000, opts);
  if (!r.ok) throw new HttpError(r.status);
  return await r.json();
}
function withTimeout(promise, ms) {
  let t;
  return Promise.race([promise, new Promise((_, rej) => { t = setTimeout(() => rej(new TimeoutErr()), ms); })])
    .finally(() => clearTimeout(t));
}
function friendlyError(e) {
  if (e instanceof NeedProxy) return "La recherche de jeux a besoin du relais Cloudflare.\nRemplis PROXY_URL en haut de index.html (voir le guide).";

  if (e instanceof TypeError) return "Impossible de se connecter.\nVérifie ta connexion internet (et PROXY_URL).";
  if (e instanceof SyntaxError) return "Réponse inattendue du site.";
  return "Erreur : " + (e && e.message ? e.message : e);
}
function friendlyDb(e) {
  const m = String((e && (e.code || e.message)) || e);
  if (/permission[_ ]denied/i.test(m)) return "La base Firebase a refusé l'accès.\nVérifie les règles de la base (guide du PC).";
  if (e instanceof TimeoutErr) return "Le serveur met trop de temps à répondre.";
  return "Erreur : " + m;
}
function proxy(url) {
  const p = PROXY_URL.trim().replace(/\/+$/, "");
  return p ? `${p}/?url=${encodeURIComponent(url)}` : url;
}

// ---------------------------------------------------------------- recherche en ligne
async function searchSteam(q) {
  if (!PROXY_URL.trim()) throw new NeedProxy();
  const url = "https://store.steampowered.com/api/storesearch/?" + new URLSearchParams({ term: q, l: "french", cc: "FR" });
  const found = await getJSON(proxy(url));
  const apps = (found.items || []).filter((a) => a && a.id && (a.type || "app") === "app").slice(0, SEARCH_LIMIT);
  if (!apps.length) return [];
  const details = {};
  try {
    const req = {
      ids: apps.map((a) => ({ appid: parseInt(a.id, 10) })),
      context: { language: "french", country_code: "FR", steam_realm: 1 },
      data_request: { include_assets: true, include_basic_info: true, include_release: true },
    };
    const u = "https://api.steampowered.com/IStoreBrowseService/GetItems/v1/?" + new URLSearchParams({ input_json: JSON.stringify(req) });
    const ans = await getJSON(proxy(u));
    for (const si of ((ans.response || {}).store_items || [])) if (si && si.appid) details[parseInt(si.appid, 10)] = si;
  } catch (e) { /* on garde les infos de base */ }

  const results = [];
  for (const app of apps) {
    const appid = parseInt(app.id, 10);
    const si = details[appid] || {};
    const assets = si.assets || {};
    const fmt = assets.asset_url_format || "";
    const asset = (key) => (fmt && assets[key] ? STEAM_ASSETS + fmt.split("${FILENAME}").join(assets[key]) : null);
    const legacy = `${STEAM_ASSETS}steam/apps/${appid}/`;
    const info = [];
    const ts = parseInt((si.release || {}).steam_release_date || 0, 10);
    if (ts > 0) info.push(String(new Date(ts * 1000).getFullYear()));
    const basic = si.basic_info || {};
    const devs = (basic.developers || []).filter((d) => d && d.name).map((d) => d.name);
    if (devs.length) info.push(String(devs[0]));
    const name = spaces(si.name || app.name || "").slice(0, MAX_NAME);
    if (!name) continue;
    results.push({
      name, alt: "", info: info.join(" · ") || "Steam",
      description: cleanText(basic.short_description, MAX_DESC),
      thumbs: uniq([asset("library_capsule"), legacy + "library_600x900.jpg", asset("header"), app.tiny_image]),
      covers: uniq([asset("library_capsule_2x"), asset("library_capsule"), legacy + "library_600x900_2x.jpg",
                    legacy + "library_600x900.jpg", asset("header"), app.tiny_image]),
    });
  }
  return results;
}

const ANILIST_QUERY = `
query ($search: String, $perPage: Int) {
  Page(perPage: $perPage) {
    media(search: $search, type: ANIME, isAdult: false, sort: [SEARCH_MATCH, POPULARITY_DESC]) {
      title { romaji english }
      coverImage { extraLarge large medium }
      format
      episodes
      seasonYear
      description(asHtml: false)
    }
  }
}`;
async function searchAnilist(q) {
  const ans = await getJSON("https://graphql.anilist.co", {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({ query: ANILIST_QUERY, variables: { search: q, perPage: SEARCH_LIMIT } }),
  });
  if (ans.errors && ans.errors.length) throw new Error(ans.errors[0].message || "erreur AniList");
  const media = ((ans.data || {}).Page || {}).media || [];
  const results = [];
  for (const m of media) {
    if (!m) continue;
    const title = m.title || {};
    const english = spaces(title.english || ""), romaji = spaces(title.romaji || "");
    const name = (english || romaji).slice(0, MAX_NAME);
    if (!name) continue;
    const alt = romaji && english && normalize(romaji) !== normalize(english) ? romaji : "";
    const info = [];
    if (ANILIST_FORMATS[m.format]) info.push(ANILIST_FORMATS[m.format]);
    if (m.seasonYear) info.push(String(m.seasonYear));
    if (Number.isInteger(m.episodes) && m.episodes > 0) info.push(`${m.episodes} épisode${m.episodes > 1 ? "s" : ""}`);
    const c = m.coverImage || {};
    results.push({
      name, alt, info: info.join(" · ") || "AniList",
      description: cleanText(m.description, MAX_DESC),
      thumbs: uniq([c.medium, c.large]),
      covers: uniq([c.extraLarge, c.large, c.medium]),
    });
  }
  return results;
}

// ---------------------------------------------------------------- images
async function blobToJpeg(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) throw new Error("image vide");
    const s = Math.min(1, COVER_SIDE / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
    const c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    const g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, cw, ch);
    g.imageSmoothingQuality = "high";
    g.drawImage(img, 0, 0, cw, ch);
    return c.toDataURL("image/jpeg", 0.85);
  } finally { URL.revokeObjectURL(url); }
}
async function fetchImage(urls) {
  let last = null;
  for (const u of urls) {
    try {
      const r = await fetchTimeout(proxy(u), 15000);
      if (!r.ok) { last = new HttpError(r.status); continue; }
      const b = await r.blob();
      if (!b.size) continue;
      return await blobToJpeg(b);
    } catch (e) { last = e; }
  }
  throw last || new Error("aucune image trouvée");
}

// ---------------------------------------------------------------- cache des images (IndexedDB)
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("gamevault", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("covers");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  async function tx(mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("covers", mode);
      const req = fn(t.objectStore("covers"));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  return {
    get: (k) => tx("readonly", (s) => s.get(k)).catch(() => null),
    put: (k, v) => tx("readwrite", (s) => s.put(v, k)),
    del: (k) => tx("readwrite", (s) => s.delete(k)).catch(() => {}),
  };
})();

function limiter(n) {
  let active = 0;
  const q = [];
  const next = () => {
    if (active >= n || !q.length) return;
    active++;
    const { fn, res, rej } = q.shift();
    fn().then(res, rej).finally(() => { active--; next(); });
  };
  return (fn) => new Promise((res, rej) => { q.push({ fn, res, rej }); next(); });
}
const coverLimit = limiter(4);
const coverMem = new Map();
const coverLoading = new Map();
const coverMissing = new Set();

function ensureCover(name) {
  if (!name) return Promise.resolve(null);
  if (coverMem.has(name)) return Promise.resolve(coverMem.get(name));
  if (coverLoading.has(name)) return coverLoading.get(name);
  if (coverMissing.has(name)) return Promise.resolve(null);
  const uid = S.uid;
  const p = (async () => {
    let url = await idb.get(name);
    if (!url && uid) {
      url = await coverLimit(async () => {
        const snap = await withTimeout(get(ref(db, `users/${uid}/covers/${coverKey(name)}`)), 20000);
        const v = snap.val();
        return typeof v === "string" && v ? `data:${mimeOf(v)};base64,${v}` : null;
      });
      if (url) idb.put(name, url).catch(() => {});
    }
    if (url) coverMem.set(name, url); else coverMissing.add(name);
    return url || null;
  })().catch(() => null).finally(() => coverLoading.delete(name));
  coverLoading.set(name, p);
  return p;
}
async function putCover(name, dataUrl) {
  coverMem.set(name, dataUrl);
  try { await idb.put(name, dataUrl); } catch (e) { /* reste en memoire */ }
}
function markPending(name) {
  if (!S.store || !name) return;
  S.store.pendingCovers.add(name);
  S.store.save();
  schedulePush(1500);
}
function dropCover(name) {
  if (!name) return;
  coverMem.delete(name);
  idb.del(name);
  if (S.store && S.store.pendingCovers.delete(name)) S.store.save();
}
function coverInto(box, name, title) {
  const url = name && coverMem.get(name);
  if (url) { box.replaceChildren(el("img", { src: url, alt: "" })); return; }
  box.replaceChildren(el("div", { class: "ph", text: title || "Aucune image" }));
  if (name) ensureCover(name).then((u) => { if (u && box.isConnected) box.replaceChildren(el("img", { src: u, alt: "" })); });
}

// ---------------------------------------------------------------- stockage local (pour marcher sans internet)
class Store {
  constructor(uid) {
    this.key = "gv_lib_" + uid;
    this.items = []; this.deleted = {}; this.order_modified = 0;
    this.dirty = false; this.pendingCovers = new Set(); this.revision = 0; this.onChange = null;
    try {
      const d = JSON.parse(localStorage.getItem(this.key) || "null");
      if (d && typeof d === "object") {
        const lib = parseLibrary(d);
        this.items = lib.items; this.deleted = lib.deleted; this.order_modified = lib.order_modified;
        this.dirty = !!d.dirty;
        this.pendingCovers = new Set((Array.isArray(d.pendingCovers) ? d.pendingCovers : []).filter((x) => typeof x === "string"));
      }
    } catch (e) { /* cache illisible : on repart du serveur */ }
  }
  lib() { return { items: this.items, deleted: this.deleted, order_modified: this.order_modified }; }
  refs() { return new Set(this.items.map((i) => i.cover).filter(Boolean)); }
  get(id) { return this.items.find((i) => i.id === id) || null; }
  save() {
    try {
      localStorage.setItem(this.key, JSON.stringify({
        items: this.items, deleted: this.deleted, order_modified: this.order_modified,
        dirty: this.dirty, pendingCovers: [...this.pendingCovers],
      }));
    } catch (e) { toast("⚠ Stockage de l'iPad plein : la modification ne sera pas gardée hors ligne.", 5000); }
  }
  commit(items, deleted, orderModified) {
    this.items = items;
    if (deleted) this.deleted = deleted;
    if (orderModified) this.order_modified = orderModified;
    this.dirty = true;
    this.revision++;
    this.save();
    if (this.onChange) this.onChange();
  }
  add(kind, name, description, status, cover) {
    const item = { id: newId(), kind, name, description, status, cover, added: nowIso(), modified: Date.now() };
    this.commit([item, ...this.items]);
    return item;
  }
  update(id, fields) {
    const t = Date.now();
    this.commit(this.items.map((i) => (i.id === id ? { ...i, ...fields, modified: t } : i)));
  }
  remove(id) {
    this.commit(this.items.filter((i) => i.id !== id), { ...this.deleted, [id]: Date.now() });
  }
  reorder(visibleIds, newIds) {
    const slots = new Set(visibleIds);
    const byId = new Map(this.items.map((i) => [i.id, i]));
    let k = 0;
    this.commit(this.items.map((i) => (slots.has(i.id) ? byId.get(newIds[k++]) : i)), null, Date.now());
  }
  applyMerged(lib) {
    const old = this.refs();
    this.items = lib.items; this.deleted = lib.deleted; this.order_modified = lib.order_modified;
    const now = this.refs();
    const removed = [...old].filter((n) => !now.has(n));
    for (const n of removed) this.pendingCovers.delete(n);
    this.save();
    return removed;
  }
}

// ---------------------------------------------------------------- synchronisation
function startSession(user) {
  endSession();
  const myGen = gen;
  S.user = user; S.uid = user.uid;
  S.pseudo = (user.email || "").split("@")[0];
  S.store = new Store(user.uid);
  S.store.onChange = () => { setSync("pending"); schedulePush(1500); };
  S.startedAt = Date.now();
  S.remoteSeen = S.store.items.length > 0;
  S.connected = false;
  showScreen("main");
  setSync("idle");
  render();
  setTimeout(() => { if (myGen === gen) { S.remoteSeen = true; render(); updateSyncLabel(); } }, 6000);

  unsubs.push(onValue(ref(db, `users/${S.uid}/library`),
    (snap) => { if (myGen === gen) onRemote(snap.val()); },
    (err) => { if (myGen === gen) setSync("error", friendlyDb(err)); }));
  unsubs.push(onValue(ref(db, ".info/connected"), (snap) => {
    if (myGen !== gen) return;
    S.connected = snap.val() === true;
    if (S.connected && S.store && (S.store.dirty || S.store.pendingCovers.size)) schedulePush(300);
    updateSyncLabel();
  }));
}
function endSession() {
  gen++;
  for (const u of unsubs) { try { u(); } catch (e) { /* deja arrete */ } }
  unsubs = [];
  clearTimeout(pushTimer);
  pushing = false; pushAgain = false; uploading = false;
  S.user = null; S.uid = null; S.store = null; S.connected = false;
  $("modals").replaceChildren();
  document.body.classList.remove("locked");
}
function onRemote(val) {
  const st = S.store;
  if (!st) return;
  S.remoteSeen = true;
  coverMissing.clear();
  const remote = parseLibrary(val);
  const merged = mergeLibraries(st.lib(), remote);
  if (!sameLibrary(merged, st.lib())) {
    for (const n of st.applyMerged(merged)) dropCover(n);
  }
  render();
  if (!sameLibrary(merged, remote)) schedulePush(500);
  else if (!st.dirty && !st.pendingCovers.size && !pushing) setSync("ok");
}
function schedulePush(ms) {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, ms);
}
async function push() {
  const st = S.store, myGen = gen, uid = S.uid;
  if (!st || !uid) return;
  if (pushing) { pushAgain = true; return; }
  if (S.dragging) { schedulePush(1000); return; }
  pushing = true; pushAgain = false;
  let failed = false;
  const rev = st.revision;
  setSync(S.connected ? "busy" : "pending");
  try {
    const res = await runTransaction(ref(db, `users/${uid}/library`),
      (cur) => payload(mergeLibraries(st.lib(), parseLibrary(cur))), { applyLocally: false });
    if (myGen !== gen) return;
    if (res.committed) {
      const merged = mergeLibraries(st.lib(), parseLibrary(res.snapshot.val()));
      for (const n of st.applyMerged(merged)) dropCover(n);
      if (st.revision === rev) { st.dirty = false; st.save(); }
      render();
    }
    await uploadPending(st, myGen, uid);
  } catch (e) {
    failed = true;
    if (myGen === gen) { setSync("error", friendlyDb(e)); schedulePush(30000); }
  } finally {
    if (myGen === gen) {
      pushing = false;
      if (!failed) {
        if (pushAgain || st.dirty) { pushAgain = false; setSync("pending"); schedulePush(500); }
        else setSync("ok");
      }
    }
  }
}
async function uploadPending(st, myGen, uid) {
  if (uploading) return;
  uploading = true;
  try {
    const refs = st.refs();
    for (const name of [...st.pendingCovers]) {
      if (myGen !== gen) return;
      if (refs.has(name)) {
        const data = coverMem.get(name) || (await idb.get(name));
        if (data && data.includes(",")) {
          await withTimeout(set(ref(db, `users/${uid}/covers/${coverKey(name)}`), data.slice(data.indexOf(",") + 1)), 30000);
        }
      }
      st.pendingCovers.delete(name);
      st.save();
    }
  } finally { uploading = false; }
}
function setSync(state, detail = "") {
  S.sync = { state, detail, at: new Date() };
  updateSyncLabel();
}
function syncText() {
  const st = S.store;
  if (!S.connected && S.sync.state !== "error") {
    if (Date.now() - S.startedAt < 4000) return ["Connexion…", "#7c7c84"];
    return [st && (st.dirty || st.pendingCovers.size)
      ? "Hors ligne · modifications gardées, envoi au retour d'internet" : "Hors ligne", "#e0a03a"];
  }
  const at = S.sync.at || new Date();
  const hhmm = `${String(at.getHours()).padStart(2, "0")}:${String(at.getMinutes()).padStart(2, "0")}`;
  const map = {
    idle: ["Connecté", "#7c7c84"],
    busy: ["Synchronisation…", "#7c7c84"],
    pending: ["Modifications en attente d'envoi…", "#e0a03a"],
    ok: [`✓ Synchronisé à ${hhmm}`, "#5fae6e"],
    error: ["⚠ Pas synchronisé, nouvel essai automatique", "#e06a5f"],
  };
  return map[S.sync.state] || map.idle;
}
function updateSyncLabel() {
  if (!S.store) return;
  const [text, color] = syncText();
  const info = $("syncInfo");
  info.textContent = text;
  info.style.color = color;
  $("accountBtn").replaceChildren(el("span", { class: "dot", style: `background:${color};margin:0` }), S.pseudo);
}

setInterval(() => {

}, 60000);

function openModal({ title, body, foot, small = false, dismiss = true, onClose }) {
  const root = $("modals");
  const back = el("div", { class: "modal-back" });
  const box = el("div", { class: "modal" + (small ? " small" : "") },
    title ? el("div", { class: "mhead", text: title }) : null,
    el("div", { class: "mbody" }, body),
    foot ? el("div", { class: "mfoot" }, foot) : null);
  back.append(box);
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    back.remove();
    if (!root.children.length) document.body.classList.remove("locked");
    if (onClose) onClose();
  };
  if (dismiss) back.addEventListener("click", (e) => { if (e.target === back) close(); });
  root.append(back);
  document.body.classList.add("locked");
  return { close, isOpen: () => !closed };
}
function confirmBox(text, okText, { danger = false, cancel = "Annuler", title = "GameVault" } = {}) {

        el("button", { class: "btn " + (danger ? "danger" : "primary"), type: "button", text: okText,
                       onclick: () => { result = true; m.close(); } })],
      onClose: () => resolve(result),

}

  const q = normalize(S.query.trim());
  let v = S.store.items.filter((i) => i.kind === S.kind
    && (S.status == null || i.status === S.status)
    && (!q || normalize(i.name).includes(q)));
  if (S.sort === "name") v = [...v].sort((a, b) => normalize(a.name).localeCompare(normalize(b.name), "fr"));
  else if (S.sort === "recent") v = [...v].sort((a, b) => (a.added < b.added ? 1 : a.added > b.added ? -1 : 0));
  return v;
}
function namesOf(kind, excludeId) {
  const s = new Set();
  if (S.store) for (const i of S.store.items) if (i.kind === kind && i.id !== excludeId) s.add(normalize(i.name));
  return s;
}
function showEmpty(title, text, btnText, action) {
  grid.replaceChildren();
  grid.hidden = true;
  lastVisible = [];
  emptyBox.hidden = false;
  emptyBox.querySelector(".t").textContent = title;
  emptyBox.querySelector(".x").textContent = text;
  const b = emptyBox.querySelector("button");
  b.hidden = !btnText;
  b.textContent = btnText || "";
  b.onclick = action || null;
}
function makeCard(i, highlight) {
  const box = el("div", { class: "cover" });
  coverInto(box, i.cover, i.name);
  return el("div", { class: "card" + (highlight ? " fadein" : ""), "data-id": i.id }, box,
    el("div", { class: "ctitle", text: i.name }),
    el("div", { class: "cstatus" }, el("span", { class: "dot", style: `background:${STATUS_COLORS[i.status]}` }),
      STATUS_LABELS[i.kind][i.status]));
}
function render(highlight) {
  const st = S.store;
  if (!st) return;
  if (S.dragging) { S.pendingRender = true; return; }
  const items = st.items, labels = STATUS_LABELS[S.kind];
  for (const k of KINDS) {
    kindBtns[k].btn.classList.toggle("on", k === S.kind);
    kindBtns[k].n.textContent = String(items.filter((i) => i.kind === k).length);
  }
  const inKind = items.filter((i) => i.kind === S.kind);
  $("chips").replaceChildren(...[null, ...STATUSES].map((key) => {
    const n = key == null ? inKind.length : inKind.filter((i) => i.status === key).length;
    return el("button", { class: "chip" + (S.status === key ? " on" : ""), type: "button",
                          onclick: () => { S.status = key; render(); window.scrollTo(0, 0); } },
      key ? el("span", { class: "dot", style: `background:${STATUS_COLORS[key]}` }) : null,
      key == null ? "Tous" : labels[key], el("span", { class: "n", text: String(n) }));
  }));
  $("addBtn").textContent = "+ " + ADD_LABEL[S.kind];

  const vis = visibleItems();
  const draggable = S.sort === "manual";
  let info;
  if (!inKind.length) info = countText(S.kind, 0);
  else if (vis.length !== inKind.length) info = `${vis.length} sur ${countText(S.kind, inKind.length)}`;
  else info = countText(S.kind, inKind.length);
  if (vis.length > 1) info += draggable ? "  ·  Maintiens une carte pour la déplacer"
                                        : "  ·  Choisis « Mon ordre » pour déplacer les cartes";
  $("countInfo").textContent = info;

  const one = KIND_WORDS[S.kind][0];
  if (!inKind.length) {
    if (!S.remoteSeen) showEmpty("Chargement de ta collection…", "", null, null);
    else showEmpty(`Aucun ${one} pour l'instant`,
      `Cherche ton premier ${one} : l'image et la description se rempliront toutes seules.`,
      ADD_LABEL[S.kind], () => addItem());
    return;
  }
  if (!vis.length) {
    const sn = labels[S.status] || "", q = S.query.trim();
    const text = q && S.status ? `Rien ne correspond à « ${q} » dans « ${sn} ».`
      : q ? `Rien ne correspond à « ${q} ».` : `Aucun ${one} avec le statut « ${sn} ».`;
    showEmpty("Aucun résultat", text, "Effacer la recherche et les filtres", () => {
      $("filter").value = ""; S.query = ""; S.status = null; render();
    });
    return;
  }
  emptyBox.hidden = true;
  grid.hidden = false;
  lastVisible = vis.map((i) => i.id);
  grid.replaceChildren(...vis.map((i) => makeCard(i, i.id === highlight)));
  if (sortable) sortable.option("disabled", !(draggable && vis.length > 1));
}

// ---------------------------------------------------------------- recherche en ligne (fenetre)
function thumbImg(urls) {
  const img = el("img", { alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
  let i = 0;
  const next = () => {
    if (i < urls.length) img.src = urls[i++];
    else if (img.isConnected) img.replaceWith(el("div", { class: "noimg" }));
  };
  img.addEventListener("error", next);
  next();
  return img;
}
function openSearch({ kind, mode = "add", query = "" }) {
  return new Promise((resolve) => {
    const one = KIND_WORDS[kind][0];
    const intro = `Tape le nom d'un ${one} pour lancer la recherche.`;
    const names = mode === "add" ? namesOf(kind) : new Set();
    let token = 0, last = null, timer = null, busy = false, picked = null, manual = null;

    const input = el("input", { class: "field", type: "search", enterkeyhint: "search",
      placeholder: `Rechercher un ${one}…  (${NAME_EXAMPLE[kind]})`,
      autocomplete: "off", autocorrect: "off", autocapitalize: "off", spellcheck: "false" });
    const source = el("div", { class: "hint", style: "margin:6px 0 12px", text: `Recherche en ligne sur ${SOURCE_NAME[kind]}.` });
    const msg = el("div", { class: "msg", text: intro });
    const list = el("div", { class: "results", hidden: true });
    const fb = el("div", { class: "feedback" });

    const foot = [];
    let statusSel = null;
    if (mode === "add") {
      foot.push(el("button", { class: "btn", type: "button", text: "Ajouter à la main…",
        onclick: () => { manual = spaces(input.value); m.close(); } }));
    }
    foot.push(el("div", { class: "grow" }));
    if (mode === "add") {
      statusSel = el("select", { class: "field", style: "width:auto" },
        STATUSES.map((s) => el("option", { value: s, text: STATUS_LABELS[kind][s] })));
      foot.push(statusSel);
    }
    foot.push(el("button", { class: "btn", type: "button", text: mode === "add" ? "Fermer" : "Annuler", onclick: () => m.close() }));

    const m = openModal({
      title: mode === "add" ? ADD_LABEL[kind] : "Trouver en ligne",
      body: [input, source, msg, list, fb], foot,
      onClose: () => { token++; clearTimeout(timer); resolve(mode === "pick" ? picked : { manual }); },
    });

    const showMsg = (t) => { msg.textContent = t; msg.hidden = false; list.hidden = true; };
    const setFb = (t, ok = true) => { fb.textContent = t; fb.style.color = ok ? "var(--ok)" : "var(--err)"; };
    const isKnown = (r) => mode === "add" && (names.has(normalize(r.name)) || (!!r.alt && names.has(normalize(r.alt))));

    async function run(force) {
      clearTimeout(timer);
      const q = spaces(input.value);
      if (q === last && !force) return;
      last = q;
      const t = ++token;
      list.replaceChildren();
      if (q.length < 2) { showMsg(intro); return; }
      showMsg("Recherche en cours…");
      try {
        const res = kind === "game" ? await searchSteam(q) : await searchAnilist(q);
        if (t !== token) return;
        if (!res.length) {
          let text = `Aucun résultat pour « ${q} ».`;
          if (kind === "game") text += "\n\nLa recherche utilise Steam : les jeux uniquement sur console (Zelda, Mario…) n'y sont pas.";
          if (mode === "add") text += "\nTu peux l'ajouter avec « Ajouter à la main… ».";
          showMsg(text);
          return;
        }
        list.replaceChildren(...res.map(makeRow));
        msg.hidden = true;
        list.hidden = false;
      } catch (e) {
        if (t !== token) return;
        last = null;
        showMsg(friendlyError(e) + "\n\nAppuie sur « Rechercher » au clavier pour réessayer.");
      }
    }
    function makeRow(r) {
      const known = isKnown(r);
      const tag = el("div", { class: "tag", text: "✓ Déjà dans ta collection", hidden: !known });
      const btn = el("button", { class: "btn primary small", type: "button", text: mode === "add" ? "Ajouter" : "Choisir", hidden: known });
      const row = el("div", { class: "row" }, thumbImg(r.thumbs),
        el("div", { class: "txt" }, el("div", { class: "rt", text: r.name }),
          r.alt ? el("div", { class: "rs", text: r.alt }) : null,
          el("div", { class: "rs", text: r.info }), tag),
        btn);
      row.addEventListener("click", () => choose(r, btn, tag));
      return row;
    }
    async function choose(r, btn, tag) {
      if (busy || isKnown(r)) return;
      busy = true;
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Téléchargement…";
      setFb("");
      let data = null;
      try { data = await fetchImage(r.covers); } catch (e) { data = null; }
      busy = false;
      if (!m.isOpen()) return;
      btn.disabled = false;
      btn.textContent = label;
      if (mode === "pick") {
        if (!data) { setFb("L'image n'a pas pu être téléchargée. Essaie un autre résultat.", false); return; }
        picked = { result: r, dataUrl: data };
        m.close();
        return;
      }
      await addFromOnline(kind, r, data, statusSel.value);
      names.add(normalize(r.name));
      tag.hidden = false;
      btn.hidden = true;
      setFb(`« ${r.name} » a été ajouté.` + (data ? "" : " (sans image : le téléchargement a échoué)") + " Tu peux en chercher un autre.");
    }
    input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => run(false), 550); });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(true); input.blur(); } });
    if (query) { input.value = query; run(false); }
    input.focus();
  });
}
async function addItem() {
  if (!S.store) return;
  const kind = S.kind;
  const res = await openSearch({ kind, mode: "add" });
  if (res && res.manual != null) openItemDialog({ kind, initialName: res.manual });
}
async function addFromOnline(kind, r, data, status) {
  const st = S.store;
  if (!st) return false;
  let cover = "";
  if (data) { cover = newId() + ".jpg"; await putCover(cover, data); }
  const item = st.add(kind, r.name, r.description, status || "todo", cover);
  if (cover) markPending(cover);
  render(item.id);
  return true;
}

// ---------------------------------------------------------------- ajouter a la main / modifier
function openEdit(id) {
  const item = S.store && S.store.get(id);
  if (item) openItemDialog({ kind: item.kind, item });
}
function openItemDialog({ kind, item = null, initialName = "" }) {
  const editing = !!item;
  let newData = null, removed = false, hasImage = !!(item && item.cover), saving = false;
  const lbl = (t) => el("label", { class: "lbl", text: t });

  const coverBox = el("div", { class: "cover" });
  const nameIn = el("input", { class: "field", maxlength: String(MAX_NAME), autocomplete: "off",
                               placeholder: NAME_EXAMPLE[kind], value: item ? item.name : initialName });
  const showCover = (url) => coverBox.replaceChildren(url ? el("img", { src: url, alt: "" })
    : el("div", { class: "ph", text: spaces(nameIn.value) || "Aucune image" }));
  const kindSel = el("select", { class: "field" }, KINDS.map((k) => el("option", { value: k, text: KIND_ONE[k] })));
  kindSel.value = item ? item.kind : kind;
  const statusSel = el("select", { class: "field" });
  const fillStatus = (key) => {
    statusSel.replaceChildren(...STATUSES.map((s) => el("option", { value: s, text: STATUS_LABELS[kindSel.value][s] })));
    statusSel.value = STATUSES.includes(key) ? key : "todo";
  };
  fillStatus(item ? item.status : "todo");
  kindSel.addEventListener("change", () => { fillStatus(statusSel.value); err.hidden = true; });

  const desc = el("textarea", { class: "field", placeholder: "Tes notes, ton avis, la plateforme…" });
  desc.value = item ? item.description : "";
  const counter = el("div", { class: "hint", style: "text-align:right;margin-top:4px" });
  const updCounter = () => {
    const n = desc.value.length;
    counter.textContent = `${n} / ${MAX_DESC}`;
    counter.style.color = n > MAX_DESC ? "var(--err)" : "";
  };
  desc.addEventListener("input", updCounter);
  updCounter();
  const err = el("div", { class: "error", hidden: true });
  const showErr = (t, w) => { err.textContent = t; err.hidden = false; if (w) w.focus(); };

  const removeBtn = el("button", { class: "btn", type: "button", text: "Retirer l'image" });
  removeBtn.disabled = !hasImage;
  removeBtn.addEventListener("click", () => {
    newData = null; removed = true; hasImage = false; showCover(null); removeBtn.disabled = true;
  });
  const findBtn = el("button", { class: "btn", type: "button", text: "Trouver en ligne…" });
  findBtn.addEventListener("click", async () => {
    const q = spaces(nameIn.value);
    const res = await openSearch({ kind: kindSel.value, mode: "pick", query: q });
    if (!res) return;
    newData = res.dataUrl; removed = false; hasImage = true;
    showCover(newData); removeBtn.disabled = false;
    if (!q) nameIn.value = res.result.name;
    if (!desc.value.trim() && res.result.description) { desc.value = res.result.description; updCounter(); }
  });
  const fileIn = el("input", { type: "file", accept: "image/*", class: "file-input" });
  fileIn.addEventListener("change", async () => {
    const f = fileIn.files && fileIn.files[0];
    fileIn.value = "";
    if (!f) return;
    try {
      newData = await blobToJpeg(f);
      removed = false; hasImage = true;
      showCover(newData); removeBtn.disabled = false;
    } catch (e) {
      alertBox("Ce fichier n'est pas une image lisible.\nChoisis une autre image.");
    }
  });
  const chooseBtn = el("label", { class: "btn" }, "Choisir une image…", fileIn);

  nameIn.addEventListener("input", () => { err.hidden = true; if (!hasImage) showCover(null); });
  if (item && item.cover) {
    showCover(coverMem.get(item.cover) || null);
    ensureCover(item.cover).then((u) => { if (u && !newData && !removed) showCover(u); });
  } else showCover(null);

  const saveBtn = el("button", { class: "btn primary", type: "button", text: "Enregistrer" });
  saveBtn.addEventListener("click", async () => {
    if (saving) return;
    const name = spaces(nameIn.value);
    if (!name) return showErr("Le nom est obligatoire.", nameIn);
    const d = desc.value.trim();
    if (d.length > MAX_DESC) return showErr(`La description est trop longue (${d.length} / ${MAX_DESC} caractères).`, desc);
    const k = kindSel.value;
    if (namesOf(k, item && item.id).has(normalize(name))) {
      if (!(await confirmBox(`« ${name} » est déjà dans tes ${KIND_TITLE[k].toLowerCase()}.\nL'enregistrer quand même ?`,
                             "Enregistrer quand même"))) return;
    }
    const st = S.store;
    if (!st) { m.close(); return; }
    saving = true;
    saveBtn.disabled = true;
    let cover = "";
    if (newData) { cover = newId() + ".jpg"; await putCover(cover, newData); }
    if (editing) {
      const cur = st.get(item.id);
      if (!cur) { m.close(); return; }
      const old = cur.cover;
      const finalCover = cover || (removed ? "" : old);
      st.update(item.id, { kind: k, name, description: d, status: statusSel.value, cover: finalCover });
      if (cover) markPending(cover);
      if (old && old !== finalCover) dropCover(old);
      if (k !== item.kind) toast(`« ${name} » déplacé dans « ${KIND_TITLE[k]} »`, 4000);
      m.close();
      render();
    } else {
      const it = st.add(k, name, d, statusSel.value, cover);
      if (cover) markPending(cover);
      if (k !== S.kind) toast(`« ${name} » ajouté dans « ${KIND_TITLE[k]} »`, 5000);
      m.close();
      render(it.id);
    }
  });
  const delBtn = editing ? el("button", { class: "btn danger", type: "button", text: "Supprimer",
    onclick: async () => { if (await deleteItem(item.id)) m.close(); } }) : null;

  const m = openModal({
    title: editing ? "Modifier" : ADD_LABEL[kind], dismiss: false,
    body: el("div", { class: "editgrid" },
      el("div", { class: "vstack editcover" }, coverBox, findBtn, chooseBtn, removeBtn),
      el("div", {},
        lbl("Nom"), nameIn,
        el("div", { class: "two" }, el("div", {}, lbl("Catégorie"), kindSel), el("div", {}, lbl("Statut"), statusSel)),
        lbl("Description (facultative)"), desc, counter, err)),
    foot: [delBtn, el("div", { class: "grow" }),
      el("button", { class: "btn", type: "button", text: "Annuler", onclick: () => m.close() }), saveBtn],
  });
  if (!editing) nameIn.focus();
}
async function deleteItem(id) {
  const it = S.store && S.store.get(id);
  if (!it) return false;
  if (!(await confirmBox(`Supprimer « ${it.name} » ?\nCette action est définitive.`, "Supprimer", { danger: true }))) return false;
  if (!S.store) return false;
  S.store.remove(id);
  if (it.cover) dropCover(it.cover);
  render();
  return true;
}

// ---------------------------------------------------------------- compte
function openAccount() {
  if (!S.store) return;
  const [text] = syncText();
  const m = openModal({
    title: "Compte", small: true,
    body: [el("div", { class: "pre", text: `Connecté en tant que ${S.pseudo}` }),
           el("div", { class: "hint pre", style: "margin-top:8px", text: text + (S.sync.detail ? "\n" + S.sync.detail : "") })],
    foot: [el("button", { class: "btn danger", type: "button", text: "Se déconnecter", onclick: () => { m.close(); logout(); } }),
      el("div", { class: "grow" }),
      el("button", { class: "btn", type: "button", text: "Fermer", onclick: () => m.close() }),
      el("button", { class: "btn primary", type: "button", text: "Synchroniser", onclick: () => { m.close(); syncNow(); } })],
  });
}
function syncNow() {
  if (!S.store) return;
  coverMissing.clear();
  if (!S.connected) toast("Hors ligne : la synchro se fera dès que l'iPad aura internet.", 4000);
  schedulePush(0);
  render();
}
async function logout() {
  if (S.store && S.store.dirty && !(await confirmBox(
    "Certaines modifications n'ont pas encore été envoyées en ligne.\nElles le seront à ta prochaine connexion avec ce compte sur cet iPad.\n\nSe déconnecter quand même ?",
    "Se déconnecter"))) return;
  await signOut(auth);
}
function authMessage(e) {
  const c = String((e && e.code) || "");
  if (c === "auth/email-already-in-use") return "Ce pseudo est déjà pris. Choisis-en un autre.";
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-login-credentials", "auth/invalid-email"].includes(c))
    return "Pseudo ou mot de passe incorrect.";
  if (c === "auth/weak-password") return "Mot de passe trop faible (6 caractères minimum).";
  if (c === "auth/too-many-requests") return "Trop d'essais. Réessaie dans quelques minutes.";
  if (c === "auth/user-disabled") return "Ce compte a été désactivé.";
  if (c === "auth/operation-not-allowed") return "La connexion par mot de passe n'est pas activée dans Firebase.";
  if (c === "auth/network-request-failed") return "Impossible de se connecter.\nVérifie ta connexion internet.";
  if (c.includes("api-key")) return "La clé FIREBASE_API_KEY est invalide.\nVérifie-la en haut de index.html.";
  return "Erreur Firebase : " + (c || (e && e.message) || "inconnue");
}

let createMode = false, loginBusy = false;
function applyLoginMode() {
  $("lgTitle").textContent = createMode ? "Créer un compte" : "Se connecter";
  $("lgSub").textContent = createMode
    ? "Si tu as déjà un compte sur ton PC, n'en crée pas un nouveau : connecte-toi avec le même.\nRetiens bien ton mot de passe, il n'y a pas de « mot de passe oublié »."
    : "Utilise le même pseudo et le même mot de passe que sur ton PC.";
  $("lgConfirmWrap").hidden = !createMode;
  $("lgOk").textContent = createMode ? "Créer le compte" : "Se connecter";
  $("lgSwitch").textContent = createMode ? "J'ai déjà un compte" : "Pas de compte ? En créer un";
  $("lgPass").setAttribute("autocomplete", createMode ? "new-password" : "current-password");
  $("lgError").hidden = true;
}
$("lgSwitch").addEventListener("click", () => { if (!loginBusy) { createMode = !createMode; applyLoginMode(); } });
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (loginBusy) return;
  const err = $("lgError");
  const showErr = (t, w) => { err.textContent = t; err.hidden = false; if (w) w.focus(); };
  const pseudo = $("lgPseudo").value.trim().toLowerCase();
  const pw = $("lgPass").value;
  if (!PSEUDO_RE.test(pseudo)) return showErr("Le pseudo doit faire 3 à 24 caractères : lettres sans accent, chiffres, - ou _.", $("lgPseudo"));
  if (pw.length < 6) return showErr("Le mot de passe doit faire au moins 6 caractères.", $("lgPass"));
  if (createMode && pw !== $("lgConfirm").value) return showErr("Les deux mots de passe ne sont pas identiques.", $("lgConfirm"));
  loginBusy = true;
  err.hidden = true;
  $("lgOk").disabled = true;
  $("lgOk").textContent = "Connexion…";
  try {
    const email = `${pseudo}@${PSEUDO_DOMAIN}`;
    if (createMode) await createUserWithEmailAndPassword(auth, email, pw);
    else await signInWithEmailAndPassword(auth, email, pw);
    $("lgPass").value = "";
    $("lgConfirm").value = "";
  } catch (ex) {
    showErr(authMessage(ex));
  } finally {
    loginBusy = false;
    $("lgOk").disabled = false;
    $("lgOk").textContent = createMode ? "Créer le compte" : "Se connecter";
  }
});

// ---------------------------------------------------------------- demarrage
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (!configured) {
  showScreen("setup");
} else {
  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (S.uid !== user.uid) startSession(user);
    } else {
      endSession();
      createMode = false;
      applyLoginMode();
      showScreen("login");
    }
  });
}
</script>
</body>
